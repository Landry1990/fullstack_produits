# Docker Compose - Développement avec WebSocket (Uvicorn multi-workers)
services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    entrypoint: ["/init-db.sh"]
    command: >-
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c wal_buffers=16MB
      -c checkpoint_completion_target=0.9
      -c default_statistics_target=100
      -c archive_mode=on
      -c archive_command='test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
      -c archive_timeout=60
      -c wal_level=replica
    volumes:
      - fullstack_postgres_data_protected:/var/lib/postgresql/data
      - wal_archive:/wal_archive
      - ./init-db.sh:/init-db.sh:ro
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-fullstack_db}
      - POSTGRES_USER=${DB_USER:-fullstack_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fullstack_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fullstack_user} -d ${DB_NAME:-fullstack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # Cache Redis (pour Django Cache + Channels)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly no
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Backend Django avec WebSocket (Uvicorn ASGI multi-workers)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput --clear &&
             uvicorn backend.asgi:application
             --host 0.0.0.0 --port 8000
             --workers 4
             --loop uvloop
             --http httptools
             --timeout-keep-alive 75
             --log-level warning"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backup-db.sh:/backup-db.sh
      - ./backups:/backups
      - wal_archive:/wal_archive
    env_file:
      - .env
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_CONN_MAX_AGE=600
      - UVICORN_WORKERS=4
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Frontend (Vite dev server)
  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile.prod
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  fullstack_postgres_data_protected:
    external: true
  redis_data:
  static_volume:
  media_volume:
  wal_archive:
