# Config nginx STAGING (déploiement bare-metal, backend via socket Unix).
# Synchronisée avec frontend/frontend/nginx.conf (version Docker) — appliquer
# tout changement de sécurité/limits aux deux fichiers.
server {
    listen 80;
    server_name YOUR_SERVER_IP_OR_DOMAIN;
    server_tokens off;

    # Uploads (imports Excel, pièces jointes, logo, ordonnances) — défaut nginx = 1 Mo
    client_max_body_size 25m;

    # Schéma réel du client : transmis par un éventuel reverse proxy amont,
    # sinon fallback sur le schéma de la connexion.
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = '') { set $forwarded_proto $scheme; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv text/xml text/javascript application/javascript application/x-javascript application/json application/xml font/woff2 image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    # NOTE: nginx n'hérite PAS les add_header du server dans une location qui
    # définit ses propres add_header — ils sont répétés dans ces locations.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://* https://*; connect-src 'self' http://* https://* ws://* wss://* ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:* ws://localhost.qz.io:* wss://localhost.qz.io:*; font-src 'self' data:; object-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Caching aggressif pour les fichiers statiques générés par Vite (hash dans le nom)
    location /assets/ {
        root /var/www/fullstack/frontend/frontend/dist;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://* https://*; connect-src 'self' http://* https://* ws://* wss://* ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:* ws://localhost.qz.io:* wss://localhost.qz.io:*; font-src 'self' data:; object-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Frontend (React Build)
    # Assurez-vous d'avoir exécuté `npm run build`
    location / {
        root /var/www/fullstack/frontend/frontend/dist;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://* https://*; connect-src 'self' http://* https://* ws://* wss://* ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:* ws://localhost.qz.io:* wss://localhost.qz.io:*; font-src 'self' data:; object-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    # proxy_set_header après include proxy_params : la dernière directive gagne.
    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/var/www/fullstack/backend/fullstack.sock;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Imports/exports lourds peuvent dépasser les 60s par défaut
        proxy_read_timeout 300s;
    }

    # Proxy WebSocket (PDA, caisse, verrouillage documents)
    location /ws/ {
        include proxy_params;
        proxy_pass http://unix:/var/www/fullstack/backend/fullstack.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    # Django Admin Proxy
    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/var/www/fullstack/backend/fullstack.sock;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Fichiers Statiques Django
    # Assurez-vous d'avoir exécuté `python manage.py collectstatic`
    location /static/ {
        alias /var/www/fullstack/backend/staticfiles/;
    }

    # Media — whitelist stricte : seul le logo pharmacie est public.
    # ordonnances/, internal_messages/, feedback/ restent servis via API authentifiée.
    location /media/pharmacy_logos/ {
        alias /var/www/fullstack/backend/media/pharmacy_logos/;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://* https://*; connect-src 'self' http://* https://* ws://* wss://* ws://localhost:* wss://localhost:* ws://127.0.0.1:* wss://127.0.0.1:* ws://localhost.qz.io:* wss://localhost.qz.io:*; font-src 'self' data:; object-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none';" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Cache-Control "public, max-age=3600";
    }

    location /media/ {
        return 404;
    }

    # Intercepte les erreurs backend et affiche la page de maintenance
    error_page 500 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/fullstack/frontend/frontend/dist;
        internal;
    }
}
