server {
    listen 80;
    server_tokens off;

    # Re-résolution DNS du nom 'backend' toutes les 10s
    # évite les 502 quand le backend redémarre avec une nouvelle IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Uploads (imports Excel, pièces jointes, logo, ordonnances) — défaut nginx = 1 Mo
    client_max_body_size 25m;

    # Headers de sécurité — voir note dans security-headers.conf sur l'héritage
    include /etc/nginx/security-headers.conf;

    # Schéma réel du client : transmis par le reverse proxy amont
    # (Tailscale Funnel = https), sinon fallback sur le schéma de la connexion.
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = '') { set $forwarded_proto $scheme; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv text/xml text/javascript application/javascript application/x-javascript application/json application/xml font/woff2 image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    root /usr/share/nginx/html;
    index index.html;

    # Caching aggressif pour les fichiers statiques générés par Vite (qui ont un hash dans le nom)
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fichiers publics non hashés (index.html, locales, favicon, fonts…) :
    # revalidation ETag à chaque chargement (304 si inchangé), jamais de cache long.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Proxy calls to the API
    # IMPORTANT: avec une variable dans proxy_pass, nginx n'ajoute pas le reste de l'URI.
    # On utilise $request_uri pour conserver le chemin et la query string complets.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Imports/exports lourds peuvent dépasser les 60s par défaut
        proxy_read_timeout 300s;
    }

    # Proxy WebSocket (PDA, caisse, verrouillage documents)
    location /ws/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 86400;
    }

    # Proxy calls to the Admin
    location /admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Fichiers statiques Django (admin) — servis par Whitenoise côté backend
    location /static/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Media — whitelist stricte : seul le logo pharmacie est public.
    # ordonnances/, internal_messages/, feedback/ restent servis via API authentifiée.
    # Nécessite media_volume monté dans le conteneur frontend (docker-compose).
    location /media/pharmacy_logos/ {
        include /etc/nginx/security-headers.conf;
        alias /app/media/pharmacy_logos/;
        add_header Cache-Control "public, max-age=3600";
    }

    location /media/ {
        return 404;
    }

    # Intercepte les erreurs backend et affiche une page de chargement
    error_page 500 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }
}
